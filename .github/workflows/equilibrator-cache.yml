name: eQuilibrator cache

# The thermodynamics job of Model QC needs the eQuilibrator compound database (1.3 GB,
# from Zenodo). A pull request can only restore caches saved on its own ref, its base
# branch or the default branch, and Model QC runs on pull requests only, so its own
# caches are invisible to other pull requests. This workflow saves the cache on develop
# (the usual base) and, on its weekly run, on main; GitHub evicts caches unused for a
# week.
on:
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Same path and key as the thermodynamics job in model-qc.yml.
      - name: Cache the eQuilibrator database
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/equilibrator
          key: equilibrator-${{ runner.os }}-${{ hashFiles('code/qc/requirements-thermodynamics.txt') }}

      - name: Download the database
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r code/qc/requirements-thermodynamics.txt
          python -c "from equilibrator_cache.api import create_compound_cache_from_zenodo; create_compound_cache_from_zenodo(tier='full')"
