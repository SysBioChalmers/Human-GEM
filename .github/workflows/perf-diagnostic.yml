name: Perf diagnostic (Gurobi/WLS + CPU throughput)

# Ad hoc diagnostic for the gene-essentiality slowdown investigation: the exact
# same code + raven-toolbox commit built one cell line's context model in 23
# minutes on 2026-09-10 and took over 5 hours (still incomplete) on a re-run
# the very next day. This isolates raw Gurobi/WLS and CPU throughput from the
# real workload (no cobra/raven-toolbox dependency) so it runs in minutes
# instead of hours. Not attached to any PR; delete once the investigation
# concludes.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal dependencies (no raven-toolbox/cobra)
        run: pip install numpy gurobipy

      - name: Set up Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.Gurobi_Eduard }}
        run: |
          if [ -n "$GUROBI_LICENSE" ]; then
            echo "$GUROBI_LICENSE" > "$HOME/gurobi.lic"
            echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
            echo "Gurobi license configured from the Gurobi_Eduard secret."
          else
            echo "::error::The Gurobi license secret (Gurobi_Eduard) is not set or not visible."
            exit 1
          fi

      - name: Run performance diagnostic
        run: python code/test/perfDiagnostic.py
