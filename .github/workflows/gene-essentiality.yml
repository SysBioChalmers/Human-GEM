name: Check gene essentiality with Hart 2015

on:
  # Run on demand only (it takes hours): via workflow_dispatch, or by commenting
  # /run gene-essentiality on a pull request (see pr-command.yml). It is not run on
  # every pull request; the Model QC comment states it has not been run and how to.
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Time Step-1a per task (bounded diagnostic) instead of the full run"
        type: boolean
        default: false
      pr:
        description: "Pull-request number to comment on (set by the /run command)"
        default: ""

env:
  # Stream Python (and raven-toolbox) stdout/stderr live into the Actions log
  # instead of block-buffering, so long steps show progress as it happens.
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose:
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r code/test/requirements-gurobi.txt

      - name: Set up Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.Gurobi_Eduard }}
        run: |
          if [ -n "$GUROBI_LICENSE" ]; then
            echo "$GUROBI_LICENSE" > "$HOME/gurobi.lic"
            echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
          else
            echo "::error::The Gurobi license secret (Gurobi_Eduard) is not set or not"\
                 "visible to this repository. The gene-essentiality workflow needs a full"\
                 "Gurobi license (WLS or named-user) to solve the genome-scale tINIT MILP;"\
                 "the size-limited license bundled with the pip gurobipy package is not"\
                 "sufficient."
            exit 1
          fi

      - name: Run Step-1a diagnostic
        run: |
          timeout 2400 python code/test/diagnoseTaskEssential.py \
            || echo "::warning::diagnostic ended (wall-clock cap or error)"

  # Step 1 (prepHumanModelForftINIT + prepINITModel) is expression-independent, so its
  # result is identical for every cell line; building it once here and handing it to
  # every `build` shard as an artifact means the 5 shards below share it instead of each
  # repeating the same tens-of-minutes computation for itself.
  prep:
    if: ${{ !inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r code/test/requirements-gurobi.txt

      - name: Set up Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.Gurobi_Eduard }}
        run: |
          if [ -n "$GUROBI_LICENSE" ]; then
            echo "$GUROBI_LICENSE" > "$HOME/gurobi.lic"
            echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
            echo "Gurobi license configured from the Gurobi_Eduard secret."
          else
            echo "::error::The Gurobi license secret (Gurobi_Eduard) is not set or not"\
                 "visible to this repository. The gene-essentiality workflow needs a full"\
                 "Gurobi license (WLS or named-user) to solve the genome-scale tINIT MILP;"\
                 "the size-limited license bundled with the pip gurobipy package is not"\
                 "sufficient."
            exit 1
          fi

      - name: Build the shared prepData once
        run: |
          python code/test/gradedEssentiality.py \
            --prep-only --prep-cache "$RUNNER_TEMP/prep-data.pkl"

      - name: Upload the shared prepData
        uses: actions/upload-artifact@v7
        with:
          name: prep-data
          path: ${{ runner.temp }}/prep-data.pkl
          retention-days: 1

  # One shard per Hart2015 cell line (data/datasets/Hart2015_RNAseq.txt has 5:
  # DLD1, GBM, HCT116, HELA, RPE1); update SHARD_COUNT below and this list together
  # if that file's cell-line columns change. Building a cell line is independent of
  # every other (each only ever touches its own checkpoint file), so sharding by cell
  # line turns the hours-long sequential loop into one wait per shard instead of a sum
  # over all of them.
  build:
    needs: prep
    if: ${{ !inputs.diagnose }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      SHARD_COUNT: 5
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r code/test/requirements-gurobi.txt

      - name: Set up Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.Gurobi_Eduard }}
        run: |
          # Only point Gurobi at a license file when the secret is actually set.
          # Writing an empty file and exporting GRB_LICENSE_FILE would override
          # gurobipy's built-in license and make Gurobi fail with a confusing
          # "No HostID specified in license file" error.
          if [ -n "$GUROBI_LICENSE" ]; then
            echo "$GUROBI_LICENSE" > "$HOME/gurobi.lic"
            echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
            echo "Gurobi license configured from the Gurobi_Eduard secret."
          else
            echo "::error::The Gurobi license secret (Gurobi_Eduard) is not set or not"\
                 "visible to this repository. The gene-essentiality workflow needs a full"\
                 "Gurobi license (WLS or named-user) to solve the genome-scale tINIT MILP;"\
                 "the size-limited license bundled with the pip gurobipy package is not"\
                 "sufficient."
            exit 1
          fi

      - name: Download the shared prepData
        uses: actions/download-artifact@v8
        with:
          name: prep-data
          path: ${{ runner.temp }}

      - name: Build this shard's cell lines
        run: |
          python code/test/gradedEssentiality.py \
            --checkpoint-dir "$RUNNER_TEMP/graded-checkpoints" \
            --shard-index ${{ matrix.shard }} --shard-count "$SHARD_COUNT" \
            --prep-cache "$RUNNER_TEMP/prep-data.pkl"

      - name: Upload this shard's checkpoints
        uses: actions/upload-artifact@v7
        with:
          name: graded-checkpoints-${{ matrix.shard }}
          path: ${{ runner.temp }}/graded-checkpoints
          retention-days: 1

  aggregate:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # CI_PUSH_TOKEN lets the results push reach a protected branch (e.g. a run
      # dispatched against develop); GITHUB_TOKEN is the fallback. See model-qc.yml.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.CI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r code/test/requirements-gurobi.txt

      - name: Set up Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.Gurobi_Eduard }}
        run: |
          if [ -n "$GUROBI_LICENSE" ]; then
            echo "$GUROBI_LICENSE" > "$HOME/gurobi.lic"
            echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
          fi

      - name: Download every shard's checkpoints
        uses: actions/download-artifact@v8
        with:
          pattern: graded-checkpoints-*
          path: ${{ runner.temp }}/graded-checkpoints
          merge-multiple: true

      - name: Combine cell lines into the final report
        id: essentiality
        run: |
          python code/test/gradedEssentiality.py \
            --checkpoint-dir "$RUNNER_TEMP/graded-checkpoints" --aggregate-only
          cat data/testResults/gene-essential_summary.md
          # Pass the Markdown summary through as a multiline step output so it
          # renders as a table in the PR comment (no <br> substitution needed).
          {
            echo "results<<GENEESS_EOF"
            cat data/testResults/gene-essential_summary.md
            echo "GENEESS_EOF"
          } >> "$GITHUB_OUTPUT"

      # This workflow is dispatched (by /run gene-essentiality), so it has no
      # pull_request context; the PR number arrives as the `pr` input instead.
      - name: Mention PR# in README.md
        if: inputs.pr != ''
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: sed -i -e "s/[[:digit:]]\{3,4\}\*\* (gene /$PR_NUMBER\*\* (gene /" data/testResults/README.md

      - name: Update local branch before committing changes
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          # --include-untracked: a result file that is new in this run is untracked
          # here, but is already tracked at the branch tip once any earlier run has
          # committed it, and plain `git stash` leaves untracked files in place, so
          # the checkout below then refuses to overwrite them and the job dies after
          # the run has already finished.
          git stash --include-untracked
          git fetch
          git checkout $BRANCH_NAME
          # `git fetch` only moves the origin/$BRANCH_NAME ref, not this local branch,
          # so without this reset the branch stays at whatever commit the job started
          # from; if anything else pushed to it while the (hours-long) build ran, the
          # auto-commit step below still bases its commit on that stale tip and its
          # push is rejected as non-fast-forward. The working tree is clean here (the
          # result-file changes are in the stash, popped back on next), so resetting
          # to origin's tip is exactly the missing "update".
          git reset --hard origin/$BRANCH_NAME
          if git stash list | grep -q 'stash@{'; then
            git stash pop
          fi

      - name: Auto-commit results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: memote-bot
          # [skip ci] so this results commit does not re-trigger the workflows.
          # Without it the memote-bot commit fires a fresh pull_request run whose
          # actor is github-actions[bot], which the repository's "require approval
          # for first-time contributors" policy holds for manual approval.
          commit_message: "chore: add gene essentiality test result [skip ci]"
          file_pattern: data/testResults/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}

      # !cancelled() rather than the implicit success(): this run takes hours, so its
      # result must still be posted even if the results push above failed.
      - name: Post comment
        if: ${{ !cancelled() && inputs.pr != '' }}
        uses: actions/github-script@v9
        env:
          TEST_RESULTS: ${{ steps.essentiality.outputs.results }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ inputs.pr }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- GENE-ESSENTIALITY-COMMENT -->';
            const body = `${marker}\n`
              + `Gene essentiality was run on this pull request via [GH Actions](${process.env.RUN_URL}). `
              + `Essentiality for a *viability* task (\`GR\` growth, \`ER\` energy/redox) is reported `
              + `separately from essentiality for a *capability* task (\`SU\`, \`BS\`, \`IC\`), and the `
              + `biomass growth ratio gives a threshold-free score (see #1076). Summary:\n\n`
              + `${process.env.TEST_RESULTS}\n\n`
              + `The full per-gene matrix is committed to \`data/testResults/gene-essential.csv\`, holding `
              + `for each cell line the confusion class, the task categories the knockout breaks and the `
              + `biomass growth ratio.\n\n`
              + `> _Note: in the case of multiple test runs, this post is edited._`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
