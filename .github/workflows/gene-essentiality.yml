name: Check gene essentiality with Hart 2015

on:
  # Run on demand only (it takes hours): via workflow_dispatch, or by commenting
  # /run gene-essentiality on a pull request (see pr-command.yml). It is not run on
  # every pull request; the Model QC comment states it has not been run and how to.
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Time Step-1a per task (bounded diagnostic) instead of the full run"
        type: boolean
        default: false
      pr:
        description: "Pull-request number to comment on (set by the /run command)"
        default: ""

env:
  # Stream Python (and raven-toolbox) stdout/stderr live into the Actions log
  # instead of block-buffering, so long steps show progress as it happens.
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose:
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r code/test/requirements-gurobi.txt

      - name: Set up Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.Gurobi_Eduard }}
        run: |
          if [ -n "$GUROBI_LICENSE" ]; then
            echo "$GUROBI_LICENSE" > "$HOME/gurobi.lic"
            echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
          else
            echo "::error::The Gurobi license secret (Gurobi_Eduard) is not set or not"\
                 "visible to this repository. The gene-essentiality workflow needs a full"\
                 "Gurobi license (WLS or named-user) to solve the genome-scale tINIT MILP;"\
                 "the size-limited license bundled with the pip gurobipy package is not"\
                 "sufficient."
            exit 1
          fi

      - name: Run Step-1a diagnostic
        run: |
          timeout 2400 python code/test/diagnoseTaskEssential.py \
            || echo "::warning::diagnostic ended (wall-clock cap or error)"

  # EXPERIMENTAL, not wired to any PR: process every cell line in one process, one
  # Gurobi session at a time, instead of the 5-way concurrent build-model/build-test
  # matrix + aggregate split. Two things went wrong under that 5-way concurrency:
  # (1) a genuine race acquiring a Gurobi session ("Too many sessions, 5 active
  # sessions for a baseline of 2") when several shards start at once, and (2) every
  # ftINIT solve taking roughly 2x its own configured TIME_LIMIT in wall-clock time,
  # suspected to be CPU oversubscription from 5 simultaneous Gurobi processes. A
  # single sequential job never holds more than 1 session (nowhere near the baseline
  # of 2, so no race is possible) and never runs more than one Gurobi solve at a time
  # (so if the 2x slowdown was contention-driven, it should disappear here). This
  # also tests whether the total fits GitHub-hosted runners' hard 360-minute-per-job
  # cap: the original, unsharded run's five cell lines took roughly 9.5+18+20+24+103
  # minutes plus ~35 minutes of shared Step-1 prep, i.e. ~210 min -- comfortably
  # under 360 if timing reverts to that; if the 2x slowdown persists even without
  # concurrency, ~380 min would instead exceed it, which is itself the answer to
  # whether concurrency was the cause.
  run-sequential:
    if: ${{ !inputs.diagnose }}
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap job execution at 360 minutes regardless of this
    # value; set it to that ceiling deliberately (see rationale above).
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r code/test/requirements-gurobi.txt

      - name: Set up Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.Gurobi_Eduard }}
        run: |
          if [ -n "$GUROBI_LICENSE" ]; then
            echo "$GUROBI_LICENSE" > "$HOME/gurobi.lic"
            echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
            echo "Gurobi license configured from the Gurobi_Eduard secret."
          else
            echo "::error::The Gurobi license secret (Gurobi_Eduard) is not set or not"\
                 "visible to this repository. The gene-essentiality workflow needs a full"\
                 "Gurobi license (WLS or named-user) to solve the genome-scale tINIT MILP;"\
                 "the size-limited license bundled with the pip gurobipy package is not"\
                 "sufficient."
            exit 1
          fi

      - name: Run gene essentiality for every cell line, one at a time
        env:
          # Report each ftINIT solve's status and achieved gap as it finishes, since the
          # solver's own log is silenced for these models.
          FTINIT_DEBUG: "1"
        run: |
          python code/test/gradedEssentiality.py --checkpoint-dir "$RUNNER_TEMP/checkpoints"
          cat data/testResults/gene-essential_summary.md

      # Runs even on a timeout or failure, so a run that does not finish in 360
      # minutes still leaves behind whichever cell lines it did complete.
      - name: Upload checkpoints (partial results included)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graded-checkpoints
          path: ${{ runner.temp }}/checkpoints
          retention-days: 1
          if-no-files-found: warn
