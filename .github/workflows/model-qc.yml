name: Model QC

on: [pull_request]

env:
  # Committed result files, fetched from the target branch so buildReport can show a
  # delta. No stamp files: freshness is passed to buildReport as RUNNING_GROUPS.
  RESULT_FILES: >-
    qc_duplicate_keys.csv qc_empty_reactions.csv qc_annotation_consistency.csv
    qc_unused_entities.csv qc_duplicate_reactions.csv qc_metabolite_completeness.csv
    qc_reaction_sanity.csv qc_annotation_issues.csv qc_growth.txt memote_score.md
    macaw_results.csv balance_results.csv

# One job runs every check and edits a single pull-request comment as results come
# in: it posts a "running" comment immediately, fills in the fast checks, then fills
# in the MEMOTE score when it finishes. Results are committed once, at the end, and
# only if they changed - so a change that does not affect the model adds no commit.
jobs:
  qc:
    runs-on: ubuntu-latest
    # Ceiling only. The fast checks finish in minutes; the MEMOTE subset in a few
    # more. The full MEMOTE suite (PRs to main) is capped by its own wall-clock limit
    # below. Kept under GitHub's 6 h hosted-runner maximum.
    timeout-minutes: 350

    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_DIR: ${{ runner.temp }}/base
      RESULTS_URL_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.head_ref }}/data/testResults
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: pip install cobra pyyaml git+https://github.com/Devlin-Moyer/macaw.git@main numpy==1.26.4

      - name: Fetch target-branch results for comparison
        run: |
          git fetch --depth=1 origin "$BASE_REF" || true
          mkdir -p "$BASE_DIR"
          for f in $RESULT_FILES; do
            git show "origin/$BASE_REF:data/testResults/$f" > "$BASE_DIR/$f" 2>/dev/null || rm -f "$BASE_DIR/$f"
          done

      # Immediate feedback: everything shows as running.
      - name: Post running comment
        uses: ./.github/actions/post-qc-comment
        with:
          running-groups: all
          base-ref: ${{ env.BASE_REF }}
          base-dir: ${{ env.BASE_DIR }}
          results-url-base: ${{ env.RESULTS_URL_BASE }}
          run-url: ${{ env.RUN_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Structural QC checks (gates + reports)
        id: qc
        continue-on-error: true
        run: python code/test/qcModelChecks.py

      - name: Annotation and cross-reference validation
        continue-on-error: true
        run: python code/test/annotationTest.py

      - name: MACAW dead-end and duplicate tests
        continue-on-error: true
        run: python code/test/macawTests.py

      - name: Mass and charge balance report
        continue-on-error: true
        run: python code/test/balanceTest.py

      # Fast checks are in; MEMOTE is still running.
      - name: Update comment with fast checks
        uses: ./.github/actions/post-qc-comment
        with:
          running-groups: memote
          base-ref: ${{ env.BASE_REF }}
          base-dir: ${{ env.BASE_DIR }}
          results-url-base: ${{ env.RESULTS_URL_BASE }}
          run-url: ${{ env.RUN_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MEMOTE dependencies
        run: pip install memote gurobipy

      - name: Set up Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.Gurobi_Eduard }}
        run: |
          if [ -n "$GUROBI_LICENSE" ]; then
            echo "$GUROBI_LICENSE" > "$HOME/gurobi.lic"
            echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
            echo "Gurobi license configured."
          else
            echo "::warning::Gurobi license secret not set; MEMOTE may not finish in time."
          fi

      - name: MEMOTE snapshot (subset on normal PRs, full suite on PRs to main)
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          # Empty for PRs to main (run the full suite); "1" otherwise (subset).
          MEMOTE_SUBSET: ${{ github.event.pull_request.base.ref != 'main' && '1' || '' }}
        run: |
          if [ "$BASE_REF" = "main" ]; then LIMIT=19800; else LIMIT=2400; fi
          echo "Running MEMOTE with a ${LIMIT}s wall-clock limit (base: $BASE_REF)."
          timeout "$LIMIT" python code/test/memoteSnapshot.py \
            || echo "::warning::MEMOTE did not finish within ${LIMIT}s; score unavailable this run."

      # Everything is in.
      - name: Update comment with all results
        uses: ./.github/actions/post-qc-comment
        with:
          running-groups: ""
          base-ref: ${{ env.BASE_REF }}
          base-dir: ${{ env.BASE_DIR }}
          results-url-base: ${{ env.RESULTS_URL_BASE }}
          run-url: ${{ env.RUN_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mention PR# in README.md
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          for tag in "model QC" "MEMOTE" "MACAW"; do
            sed -i -e "s/[[:digit:]]\{3,4\}\*\* ($tag/$PR_NUMBER\*\* ($tag/" data/testResults/README.md
          done

      - name: Update local branch before committing changes
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git stash
          git fetch
          git checkout $BRANCH_NAME
          if git stash list | grep -q 'stash@{'; then
            git stash pop
          fi

      - name: Auto-commit results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: memote-bot
          # [skip ci] so this results commit does not re-trigger the workflow.
          commit_message: "chore: update model QC results [skip ci]"
          file_pattern: data/testResults/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full MEMOTE result
        uses: actions/upload-artifact@v7
        with:
          name: memote-result
          path: memote_result.json
          if-no-files-found: ignore

      # Fail the build if a gate failed, but only after the detail is committed and
      # the comment updated, so the failure is visible in both.
      - name: Fail if a build gate failed
        if: steps.qc.outcome == 'failure'
        run: |
          echo "::error::A build gate failed; see the Structural checks table in the PR comment and the linked CSVs."
          exit 1
