name: YAML validation

on: [push]

jobs:
  yaml-validation:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/metabolicatlas/memote-docker:0.17
      volumes:
        - ${{ github.workspace }}:/project:rw
      options: --user root --workdir /project

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: YAML Lint
        uses: metabolicatlas/action-yamllint@v3
        with:
          ## File(s) or Directory, separate by space if multiple files or folder are specified
          file_or_dir: model/
          ## Custom configuration (as YAML source)
          config_data: "{extends: default, rules: {line-length: disable}}"
          ## Return non-zero exit code on warnings as well as errors
          # strict: # optional, default is false

      # The former semantic checks here (cobra load, model<->annotation consistency,
      # duplicate/empty reactions) were consolidated into code/test/qcModelChecks.py,
      # which runs in the Model QC checks workflow and writes a detailed CSV plus a
      # pull-request comment for each finding.
