name: Release

# Cuts a release branch from develop, stamps the version and regenerates the
# model exports with code/io/increaseHumanGEMVersion.py, and opens the release
# pull request into main for a human to approve. The release notes are written
# in the description of that pull request, and a check keeps it from being merged
# without them. On merge, tags the release, publishes it on GitHub with the notes
# as its text, and opens the sync-back pull request into develop.
#
# The release pull request is checked by model-qc.yml, which runs on every pull
# request, so the model quality report appears on it without extra wiring here.
#
# See .github/CONTRIBUTING.md, "Releasing a new version", for the manual steps
# that remain (writing the release notes).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version to cut, e.g. 2.1.0"
        required: false
      finalize_version:
        description: "Version already merged into main, to tag and publish"
        required: false
  # The release is finalized from the push to main, not from the pull request
  # being closed. A release branch is deleted the moment its pull request is
  # merged, and a pull_request event resolves its workflow file from the merge
  # ref that goes with it, so the "closed" run is never created: 2.1.0 and 2.1.1
  # both had to be tagged and published by hand. A push to main always produces
  # a run, and reads the workflow from main itself. Every push is handled, not
  # only one touching version.txt, because the job is a no-op once the version
  # in version.txt is released.
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# The release itself (dispatch and merge) runs one at a time; the notes check of a
# release pull request runs in its own group, so editing the description never
# queues behind or replaces a release run.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && 'release' || format('release-notes-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

env:
  # Generated or stamped at release time, tracked on main only. Kept in one place
  # because both the build commit and the sync-back need the same list, and
  # branch-hygiene.yml rejects them on develop.
  RELEASE_ONLY_FILES: >-
    model/Human-GEM.mat model/Human-GEM.txt model/Human-GEM.xlsx
    model/Human-GEM.xml model/dependencies.txt version.txt

jobs:
  # --- Cut the branch ----------------------------------------------------

  cut:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r code/test/requirements.txt

      # Fails here, before a branch exists, rather than partway through the
      # build job. Reads the current version from origin/main, since develop
      # does not track version.txt.
      - name: Validate the version
        run: |
          python code/io/increaseHumanGEMVersion.py validate \
            --version "${{ github.event.inputs.version }}"

      - name: Cut the release branch
        run: |
          git checkout -b "release/${{ github.event.inputs.version }}"
          git push origin "release/${{ github.event.inputs.version }}"

  # --- Stamp the version and regenerate the exports ----------------------

  build:
    needs: cut
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/${{ github.event.inputs.version }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # openpyxl is what pandas writes .xlsx through, and is not pulled in by
      # code/test/requirements.txt, which covers the task and round-trip tests.
      - name: Install dependencies
        run: |
          pip install -r code/test/requirements.txt
          pip install openpyxl

      # Writes version.txt, stamps the version into the model metadata,
      # regenerates model/Human-GEM.{yml,mat,xml,xlsx,txt} and
      # model/dependencies.txt, and fills the {{nRXN}} / {{nMET}} / {{nGENE}} /
      # {{DATE}} placeholders README.md carries on develop.
      - name: Build the release
        run: |
          python code/io/increaseHumanGEMVersion.py build \
            --version "${{ github.event.inputs.version }}"

      # release/X.Y.Z is not protected, so the default token can push to it
      # directly. Everything into main or develop still goes through a
      # reviewed pull request.
      - name: Commit
        run: |
          git config user.name "human-gem-bot"
          git config user.email "human-gem-bot@users.noreply.github.com"
          git add $RELEASE_ONLY_FILES model/Human-GEM.yml README.md
          git commit -m "chore: version ${{ github.event.inputs.version }}"
          git push

  # --- Open the release pull request -------------------------------------

  open-pr:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/${{ github.event.inputs.version }}

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        # The description is the release notes: everything outside HTML comments is
        # published as the text of the GitHub release (and of its Zenodo record).
        run: |
          cat > "$RUNNER_TEMP/body.md" <<EOF
          <!--
          Automated release build for $VERSION. Write the release notes in this
          description, replacing the placeholder line below: everything outside
          these comments becomes the text of the GitHub release "Human $VERSION".
          See the wiki page "How to make a new release" for their structure.

          Review the Model QC comment, then merge with a merge commit. Merging tags
          v$VERSION, publishes the release, and opens the sync-back pull request
          into develop.
          -->

          RELEASE-NOTES-PLACEHOLDER: replace this line with the release notes.
          EOF
          gh pr create --base main --head "release/$VERSION" \
            --title "chore: version $VERSION" --body-file "$RUNNER_TEMP/body.md"

  # --- Keep the release pull request from merging without notes -----------

  check-notes:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The description arrives through an environment variable, never inlined
      # into the script, so its text cannot run as shell.
      - name: Check that the release notes are written
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          notes=$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//gs' | sed '/^[[:space:]]*$/d')
          if [ -z "$notes" ] || printf '%s' "$notes" | grep -q 'RELEASE-NOTES-PLACEHOLDER'; then
            echo "::error::Write the release notes in the description of this pull request; they become the text of the GitHub release."
            exit 1
          fi

  # --- On merge: tag, release, sync back ---------------------------------

  finalize:
    # Driven by the push to main that lands a release, with a dispatch fallback
    # for a release that has already landed. Idempotent: the version in
    # version.txt is released once, so an ordinary push to main, a re-run or a
    # release published by hand all leave it a no-op.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.finalize_version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # version.txt on main is what the build stamped, so it names the release
      # that has landed; the dispatch input overrides it when finalizing an
      # older one by hand.
      - name: Work out which version to release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ inputs.finalize_version }}"
          [ -n "$version" ] || version="$(tr -d '[:space:]' < version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to finalize."
            echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      # The notes live in the description of the release pull request. Its head
      # branch is deleted on merge, but the pull request keeps the branch name,
      # so it stays findable. Failing here is deliberate: a release that reaches
      # main without notes should stop loudly rather than publish an empty one.
      - name: Take the release notes from the release pull request
        if: steps.v.outputs.todo == 'true'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.v.outputs.version }}"
          gh pr list --state merged --base main --head "release/$version" \
            --limit 1 --json body --jq '.[0].body // ""' > "$RUNNER_TEMP/body.md"
          if [ ! -s "$RUNNER_TEMP/body.md" ]; then
            echo "::error::no merged release pull request found for release/$version, or it has no description"
            exit 1
          fi
          perl -0pe 's/<!--.*?-->//gs; s/\A\s+//' "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/notes.md"

      # The tag keeps the "vX.Y.Z" form used by every existing tag, and the
      # release title follows the "Human X.Y.Z" convention.
      - name: Tag and publish the release
        if: steps.v.outputs.todo == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.v.outputs.version }}"
          gh release create "v$version" --target main --title "Human $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Open the sync-back pull request into develop
        if: steps.v.outputs.todo == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.v.outputs.version }}"
          if git ls-remote --exit-code --heads origin "sync/main-to-develop-$version" >/dev/null 2>&1; then
            echo "sync/main-to-develop-$version already exists; leaving it alone."
            exit 0
          fi
          git config user.name "human-gem-bot"
          git config user.email "human-gem-bot@users.noreply.github.com"
          git fetch origin develop
          git checkout -b "sync/main-to-develop-$version" origin/develop
          git merge --no-commit --no-ff origin/main
          git rm --cached $RELEASE_ONLY_FILES
          git checkout origin/develop -- README.md model/Human-GEM.yml
          git commit -m "chore: merge main into develop after $version, without the release-only files"
          git push origin "sync/main-to-develop-$version"
          gh pr create --base develop --head "sync/main-to-develop-$version" \
            --title "chore: sync main into develop after $version" \
            --body "Brings $version back into \`develop\`, keeping the generated model files and \`version.txt\` off it, and keeping \`develop\`'s \`README.md\` placeholders and \`model/Human-GEM.yml\`. See branch-hygiene.yml, which would otherwise flag them."
