[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "human-gem"
version = "0.1.0"
description = "Python interface to the Human-GEM genome-scale metabolic model, on cobrapy and raven-toolbox."
requires-python = ">=3.11"
authors = [{ name = "SysBioChalmers" }]
dependencies = [
    "cobra>=0.29",
    "pandas>=1.5",
    # raven-toolbox is the Python RAVEN port. 3.0.0b1 is a pre-release, and naming it
    # in the specifier is what lets pip install one for this requirement.
    "raven-toolbox>=3.0.0b1",
]

[project.urls]
Homepage = "https://github.com/SysBioChalmers/Human-GEM"
Repository = "https://github.com/SysBioChalmers/Human-GEM"

[tool.setuptools]
packages = ["human_gem"]
